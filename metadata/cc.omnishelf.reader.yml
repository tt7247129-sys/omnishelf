AutoName: OmniShelf
Description: |-
  A free ebook and document reader: 34 file types, offline text-to-speech,
  highlights and notes, OPDS catalogues, 54 interface languages.

  No advertising, no analytics, no crash reporting, no account and no
  telemetry code of any kind. Books and reading progress stay on the device.

  This is an independent fork of Librera Reader.

RepoType: git
