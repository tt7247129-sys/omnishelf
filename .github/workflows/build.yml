# Builds an installable APK on every push. No NDK, no MuPDF source build: the arm64
# native libraries live in app/src/main/jniLibs, so the only thing CI needs is a JDK and
# an Android SDK. That is deliberate - the previous pipeline cloned and compiled MuPDF,
# which took fourteen minutes and failed, and a pipeline that cannot go green helps nobody.
name: build

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'web/**'
      - 'delivery/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Secrets cannot be read in an if: conditional, so the check is done here and the
      # signed steps below look at this flag instead.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || 'no' }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The runner ships an Android SDK; asking its sdkmanager for the platform is more
      # reliable than android-actions/setup-android, which tries to install a retired
      # 'tools' package and fails within a minute.
      - name: Android SDK components
        run: |
          set -uo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          for pkg in "platform-tools" "platforms;android-37" "platforms;android-37.0" \
                     "build-tools;36.0.0" "build-tools;37.0.0"; do
            echo "-> $pkg"
            "$SDKM" --install "$pkg" || echo "  (skipped: $pkg)"
          done
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Sanity check the native libraries travel with the repository
        run: |
          set -uo pipefail
          for lib in libmupdf.so libdjvu.so libmobi.so; do
            test -f "app/src/main/jniLibs/arm64-v8a/$lib" \
              || { echo "::error::missing app/src/main/jniLibs/arm64-v8a/$lib"; exit 1; }
          done
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Gradle version probe
        run: |
          set -uo pipefail
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        run: |
          set -uo pipefail
          ./gradlew --no-daemon :app:assembleProDebug -x lint --no-configuration-cache --stacktrace

      - name: Check the APK can actually open a book
        run: |
          set -uo pipefail
          APK=$(find app/build/outputs/apk -name '*arm64*.apk' | head -1)
          echo "APK: $APK"
          test -n "$APK" || { echo "::error::no arm64 APK was produced"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libmupdf.so' \
            || { echo "::error::libmupdf.so is not inside the APK - opening a book would fail"; exit 1; }

      - name: Collect
        run: |
          set -uo pipefail
          mkdir -p out
          cp "$(find app/build/outputs/apk -name '*arm64*.apk' | head -1)" out/OmniShelf-arm64-debug.apk
          ls -lh out/

      - name: Publish to a fixed download page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG=latest
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "OmniShelf 最新构建" \
              --notes "自动构建产物:arm64 调试签名 APK,可直接安装测试。" \
              --prerelease || true
          fi
          gh release upload "$TAG" out/* --clobber || true
          echo "下载页:https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"


      # ---- signed artifacts, only when the upload key is configured ----
      - name: Decode the upload keystore
        if: env.HAS_KEYSTORE == 'yes'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Signed bundle and APK
        if: env.HAS_KEYSTORE == 'yes'
        env:
          S: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          K: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          ./gradlew --no-daemon :app:bundleProRelease :app:assembleProRelease -x lint \
            --no-configuration-cache \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" \
            -PRELEASE_STORE_PASSWORD="$S" \
            -PRELEASE_KEY_ALIAS="$A" \
            -PRELEASE_KEY_PASSWORD="$K"

      - name: Verify the signed artifacts
        if: env.HAS_KEYSTORE == 'yes'
        run: |
          set -uo pipefail
          AAB=$(find app/build/outputs/bundle/proRelease -name '*.aab' | head -1)
          # Not a bare find: this job also builds a debug APK, and picking that one would
          # publish a debug-signed file under the name "signed".
          APK=$(find app/build/outputs/apk/pro/release -name '*arm64*.apk' | head -1)
          echo "AAB=$AAB"; echo "APK=$APK"
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::AAB not signed"; exit 1; }
          COUNT=$(unzip -l "$AAB" | grep -cE 'META-INF/.*\.(RSA|SF)')
          echo "signature entries: $COUNT"
          [ "$COUNT" = "2" ] || { echo "::error::expected one certificate chain"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate SHA-1" || true
          cp "$AAB" out/OmniShelf-1.2.0.aab
          cp "$APK" out/OmniShelf-1.2.0-arm64-signed.apk

      - name: Publish signed artifacts
        if: env.HAS_KEYSTORE == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG=signed
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "OmniShelf 签名构建" \
              --notes "已用 Play 上传密钥签名,可直接上架或安装。" --prerelease || true
          fi
          gh release upload "$TAG" out/OmniShelf-1.2.0.aab out/OmniShelf-1.2.0-arm64-signed.apk --clobber || true
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - uses: actions/upload-artifact@v4
        with:
          name: omnishelf-arm64-debug-apk
          path: out/*
          if-no-files-found: error
          retention-days: 30
