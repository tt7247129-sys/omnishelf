# Compiles the app on every push and leaves an installable debug APK behind.
#
# It exists because a local machine may have no JDK 17-21, no Gradle cache and no network
# to the Maven repositories. GitHub's runners have all three, and a public repository does
# not spend minutes on this.
name: build

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - 'web/**'
      - 'delivery/**'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleProDebug -x lint --no-configuration-cache --stacktrace

      - name: Check the native library made it into the APK
        run: |
          APK=$(find app/build/outputs/apk/pro/debug -name '*arm64*.apk' | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/(libmupdf|libdjvu|libmobi)\.so' \
            || { echo "::error::native libraries missing from the APK"; exit 1; }

      - name: List outputs
        if: always()
        run: find app/build/outputs -name '*.apk' -printf '%p %s bytes\n' || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: omnishelf-debug-apk
          path: app/build/outputs/apk/pro/debug/*arm64*.apk
          if-no-files-found: warn
