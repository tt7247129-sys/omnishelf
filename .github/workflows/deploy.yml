name: deploy

# The custom domain is live (omnishelf.cc, certificate approved, HTTPS enforced),
# so a push to master can safely publish the site. The github-pages environment
# only permits deployments from master, which is why the branch is master here.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the build is complete
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/privacy/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          pages=$(find dist -name index.html | wc -l)
          echo "pages: $pages"
          test "$pages" -ge 17

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
