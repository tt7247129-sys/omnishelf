name: deploy

# The site lives on a branch of its own so that a push to master cannot take the
# live Pages deployment down while the domain is being moved. Merge to
# `site-live` when DNS and the custom domain are ready; until then this workflow
# only runs when started by hand.
on:
  push:
    branches: [site-live]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the build is complete
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/privacy/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          pages=$(find dist -name index.html | wc -l)
          echo "pages: $pages"
          test "$pages" -ge 17

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
