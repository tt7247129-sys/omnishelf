# Builds a signed App Bundle for the store, without a local toolchain.
#
# Add these repository secrets first (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD   its store password
#   KEY_ALIAS           the key alias inside it
#   KEY_PASSWORD        the key password (often the same)
#
# The keystore must be the one Play already registered (SHA-1 5B:64:C1:...), otherwise the
# upload is rejected. base64 on macOS: base64 -i omnishelf-upload.jks | pbcopy
name: release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName, e.g. 1.2.0'
        required: true
        default: '1.2.0'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed bundle and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleProRelease :app:assembleProRelease -x lint \
            --no-configuration-cache \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks" \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Verify the bundle has one certificate
        run: |
          AAB=$(find app/build/outputs/bundle -name '*.aab' | head -1)
          unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|SF)' || true
          jarsigner -verify -certs "$AAB" | head -5

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnishelf-release-${{ github.event.inputs.versionName }}
          path: |
            app/build/outputs/bundle/proRelease/*.aab
            app/build/outputs/apk/pro/release/*.apk
          if-no-files-found: error
